<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Source Photo Gradient (Google Photos Vibe) -->
    <linearGradient id="photoSrcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Immich Destination Gradient (Immich Blue/Indigo Vibe) -->
    <linearGradient id="immichGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Left: Google Photos Petal Motif -->
  <g transform="translate(140, 220) scale(0.85)">
    <!-- Top Petal (Red) -->
    <path d="M 0,0 C 0,-45 45,-45 45,0 Z" fill="#ef4444" opacity="0.9" />
    <!-- Right Petal (Blue) -->
    <path d="M 0,0 C 45,0 45,45 0,45 Z" fill="#3b82f6" opacity="0.9" />
    <!-- Bottom Petal (Green) -->
    <path d="M 0,0 C 0,45 -45,45 -45,0 Z" fill="#10b981" opacity="0.9" />
    <!-- Left Petal (Yellow) -->
    <path d="M 0,0 C -45,0 -45,-45 0,-45 Z" fill="#f59e0b" opacity="0.9" />
  </g>

  <!-- Dynamic Curved Migration Flow Arrow -->
  <path d="M 180,256 C 215,200 280,200 320,240" fill="none" stroke="url(#borderGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="8 12" opacity="0.75" />

  <path d="M 195,290 C 240,335 295,315 330,270" fill="none" stroke="url(#immichGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
  <!-- Arrow Head -->
  <polygon points="345,260 320,250 338,285" fill="#38bdf8" />

  <!-- Right: Immich Shutter / Lens Hexagon Motif -->
  <g transform="translate(345, 235) scale(0.95)" filter="url(#glow)">
    <!-- Base App Rounded Container -->
    <rect x="-65" y="-65" width="130" height="130" rx="34" fill="url(#immichGrad)" />
    <!-- Inner Lens / Aperture Lines -->
    <circle cx="0" cy="0" r="38" fill="#0f172a" opacity="0.4" />
    <circle cx="0" cy="0" r="24" fill="#ffffff" opacity="0.9" />
    <circle cx="7" cy="-7" r="7" fill="#38bdf8" />
  </g>

  <!-- Speed Dash Particles -->
  <circle cx="230" cy="190" r="5" fill="#38bdf8" opacity="0.8" />
  <circle cx="270" cy="180" r="4" fill="#818cf8" opacity="0.6" />
  <circle cx="250" cy="340" r="5" fill="#ec4899" opacity="0.7" />
  <circle cx="285" cy="330" r="4" fill="#34d399" opacity="0.8" />

  <!-- Subtitle Typography -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="3">
    IMMICH MIGRATOR
  </text>
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">
    FROM GOOGLE TAKEOUT
  </text>
</svg>
