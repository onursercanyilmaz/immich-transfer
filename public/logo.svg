<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Dark Gradient -->
    <radialGradient id="meshGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Glowing Cyber Neon Gradients -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="borderShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Deep Ambient Shadow Filter -->
    <filter id="ultraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur1" />
      <feGaussianBlur stdDeviation="36" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#meshGrad)" stroke="url(#borderShine)" stroke-width="3" filter="url(#softShadow)" />

  <!-- Subtle Internal Grid Ambient Glow -->
  <circle cx="160" cy="160" r="120" fill="#38bdf8" opacity="0.08" filter="url(#ultraGlow)" />
  <circle cx="350" cy="350" r="140" fill="#a855f7" opacity="0.10" filter="url(#ultraGlow)" />

  <!-- Modern Geometric Icon Composition:
       Two overlapping dynamic floating frames morphing through a continuous transfer hyper-loop -->

  <!-- Back Frame (Archive / Source Cloud) -->
  <g transform="translate(140, 150) rotate(-10)">
    <rect x="-70" y="-85" width="140" height="170" rx="28" fill="url(#cardGrad)" stroke="#64748b" stroke-width="2" stroke-opacity="0.3" backdrop-filter="blur(10px)" />
    <!-- Sun/Moon dot inside source photo -->
    <circle cx="30" cy="-45" r="14" fill="#f43f5e" opacity="0.8" />
    <!-- Mountain vector contour inside source photo -->
    <path d="M -50,55 L -10,0 L 25,40 L 45,15 L 60,55 Z" fill="#64748b" opacity="0.35" />
  </g>

  <!-- Front Frame (Immich Vault Destination) -->
  <g transform="translate(365, 335) rotate(10)" filter="url(#softShadow)">
    <rect x="-80" y="-100" width="160" height="200" rx="34" fill="url(#cardGrad)" stroke="url(#streamGrad1)" stroke-width="3" stroke-opacity="0.7" />
    <!-- Immich Shutter Geometry Motif -->
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="url(#streamGrad1)" stroke-width="3" />
    <circle cx="0" cy="0" r="22" fill="url(#streamGrad1)" />
    <circle cx="8" cy="-8" r="7" fill="#ffffff" />
  </g>

  <!-- Central Dynamic Transfer Ribbon (Infinity Flow) -->
  <g filter="url(#ultraGlow)">
    <!-- Primary Cyan-Indigo Arc -->
    <path d="M 155,270 C 130,370 230,410 280,360 C 330,310 260,200 340,165 C 400,135 440,210 395,280" 
          fill="none" 
          stroke="url(#streamGrad1)" 
          stroke-width="20" 
          stroke-linecap="round" />

    <!-- Secondary Coral-Purple Arc (Weaving through) -->
    <path d="M 140,240 C 160,150 250,140 295,190 C 340,240 280,330 350,355" 
          fill="none" 
          stroke="url(#streamGrad2)" 
          stroke-width="14" 
          stroke-linecap="round" 
          opacity="0.9" />
  </g>

  <!-- Dynamic Data Stream Pulses (Floating Orbs) -->
  <circle cx="210" cy="180" r="6" fill="#38bdf8" />
  <circle cx="280" cy="225" r="5" fill="#ffffff" />
  <circle cx="310" cy="310" r="7" fill="#ec4899" />
  <circle cx="230" cy="380" r="6" fill="#818cf8" />
  <circle cx="160" cy="330" r="4" fill="#34d399" />
</svg>
